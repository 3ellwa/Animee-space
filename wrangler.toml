name = "animee-space"
main = "worker.js"
compatibility_date = "2025-11-01"

[[d1_databases]]
binding = "DB"
database_name = "animee-space"
database_id = "bc75323b-aa43-466d-aa3e-929f48dd5f16"
migrations_dir = "migrations"

# cinemee (cinemee.animee.space) keeps its own accounts and saved data (functions/_lib/site.js).
# Same tables as animee, so it uses the same migrations folder.
# TODO before deploying: replace the placeholder with the id from `npx wrangler d1 create cinemee`.
[[d1_databases]]
binding = "CINEMEE_DB"
database_name = "cinemee"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
ANIMEE_EMBED_PROVIDERS = "[]"

# Sign-in / sign-up throttling (functions/_lib/account.js). Counters live at the edge, not in D1.
# period must be 10 or 60 seconds; namespace_id is any number unique to this account.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "41001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "REGISTER_LIMITER"
namespace_id = "41002"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "41003"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "REQUEST_LIMITER"
namespace_id = "41004"
simple = { limit = 3, period = 60 }

# New-episode pop-ups (functions/_lib/push.js): check followed shows every 10 minutes.
# Needs the VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY secrets: run `node scripts/setup-push.mjs` once.
[triggers]
crons = ["*/10 * * * *"]
